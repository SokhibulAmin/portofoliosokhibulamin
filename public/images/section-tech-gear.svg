<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 760" fill="none">
  <style>
    .gear-wheel {
      transform-box: fill-box;
      transform-origin: center;
    }

    .gear-wheel--large {
      animation: spin-clockwise 34s linear infinite;
    }

    .gear-wheel--medium {
      animation: spin-counterclockwise 27s linear infinite;
    }

    .gear-wheel--small {
      animation: spin-clockwise 42s linear infinite;
    }

    .led-runner {
      animation: led-pulse 1.2s ease-in-out infinite alternate;
    }

    @keyframes spin-clockwise {
      to { transform: rotate(360deg); }
    }

    @keyframes spin-counterclockwise {
      to { transform: rotate(-360deg); }
    }

    @keyframes led-pulse {
      from { opacity: .65; }
      to { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .gear-wheel { animation: none !important; }
      .led-runner { display: none; }
    }
  </style>

